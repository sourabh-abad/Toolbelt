<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts load without blocking first paint: the system stack renders
         immediately and Inter swaps in once fetched. -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    </noscript>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>DevPocket — Developer Utilities that Never Leave Your Browser</title>
    <meta
      name="description"
      content="A free, local-first toolbox for developers: format JSON, XML & SQL, decode JWTs, read cron expressions, convert YAML/CSV, generate mock data and more. Runs entirely in your browser — nothing you paste is ever uploaded."
    />
    <meta name="author" content="Sourabh" />
    <meta name="keywords" content="json formatter, xml formatter, sql formatter, jwt decoder, cron expression, yaml to json, base64, uuid generator, regex tester, developer tools" />
    <link rel="canonical" href="https://devpocket.in/" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />

    <!-- Open Graph (WhatsApp, Slack, LinkedIn, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://devpocket.in/" />
    <meta property="og:site_name" content="DevPocket" />
    <meta property="og:title" content="DevPocket — Developer Utilities that Never Leave Your Browser" />
    <meta
      property="og:description"
      content="26+ local-first developer tools: JSON & XML formatter, JWT validator, SQL beautifier, cron builder, diff checker and mock data generator. 100% browser-based."
    />
    <meta property="og:image" content="https://devpocket.in/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DevPocket — everything a backend dev reaches for" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DevPocket — Developer Utilities that Never Leave Your Browser" />
    <meta
      name="twitter:description"
      content="26+ local-first developer tools: JSON & XML formatter, JWT validator, SQL beautifier, cron builder, diff checker. 100% browser-based."
    />
    <meta name="twitter:image" content="https://devpocket.in/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DevPocket",
        "url": "https://devpocket.in/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "description": "A local-first toolbox of everyday developer utilities that runs entirely in the browser.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Sourabh Kumar", "url": "https://devpocket.in/" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
