name: Deploy to GitHub Pages

on:
  # Every push to main rebuilds and republishes the site.
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# Permissions the official Pages actions require.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer deploy win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the build derives each page's sitemap
          # <lastmod> from its last commit date, which the default
          # shallow clone hides.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Strictly `npm ci`: it installs from the lockfile without re-resolving,
      # and the setup-node cache above is keyed on that lockfile. Falling back
      # to `npm install` on a stale lock is what turned a 30-second deploy into
      # a four-minute one — the fallback hid the drift instead of failing.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Pages replaces the whole site on deploy. Carry the live release's
      # hashed chunks forward for one more release, so a tab or cached HTML
      # page from before this deploy does not 404 on its chunks.
      - name: Keep previous release's assets
        run: node scripts/keep-previous-assets.mjs https://devpocket.in

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Cloudflare sits in front of Pages and would otherwise keep serving the old
  # HTML and sw.js from its edge. Needs two repository secrets:
  #   CLOUDFLARE_ZONE_ID    — devpocket.in's Zone ID (Cloudflare dashboard, Overview)
  #   CLOUDFLARE_API_TOKEN  — a token with the Zone › Cache Purge permission
  # Without them this job logs a warning and does nothing.
  purge-cloudflare:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cloudflare cache
        env:
          ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$ZONE" ] || [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID / CLOUDFLARE_API_TOKEN not set; skipping cache purge"
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
